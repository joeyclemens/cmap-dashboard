[package]
name = "cmap-dashboard"
version = "0.1.0"
edition = "2021"
description = "Download cmap resource availability, compare with last week and build the weekly dashboards"

[dependencies]
tokio = { version = "1", features = ["full"] }
chromiumoxide = "0.9"
futures = "0.3"
serde_json = "1"
dotenvy = "0.15"
anyhow = "1"
chrono = "0.4"
url = { version = "2" }
csv = "1"
calamine = { version = "0.31", features = ["dates"] }
fastrand = "2"
dirs = "5"
rpassword = "7"
keyring = { version = "3", features = ["windows-native"] }
